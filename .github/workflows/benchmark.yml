name: Reproduce
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: ./run.sh
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: sql-and-measurements
          path: results/
